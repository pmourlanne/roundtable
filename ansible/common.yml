- hosts: all
  become: yes
  remote_user: debian

  tasks:
    - name: Ensure user exists
      user:
        name: pmourlanne
        password: "!"
        shell: /bin/bash
        create_home: true
        groups: sudo

    - name: Let the user use sudo without password
      copy:
        content: pmourlanne ALL=(ALL) NOPASSWD:ALL
        dest: /etc/sudoers.d/pmourlanne
        owner: root
        group: root
        mode: '0440'

    - name: Add SSH Keys
      authorized_key:
        user: pmourlanne
        key: "ssh-rsa "
        state: present
